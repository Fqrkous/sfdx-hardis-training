projectName: HeliosEnergy
developmentBranch: integration
productionBranch: main
orgAuthenticationMode: secretsOnly
availableTargetBranches:
  - integration
  - preprod
availableTargetBranchesLabels:
  - The shared integration org, where every contributor merges
  - The org where hotfix should start
branchPrefixChoices:
  - value: features
    title: "Feature: a new capability or an improvement"
  - value: fix
    title: "Fix: correct something that is broken"
  - value: retrofit
    title: "Retrofit: merge production back down into the pipeline after a hotfix (release manager)"
newTaskNameRegex: ^US-\d{3}-[a-z0-9-]+$
newTaskNameRegexExample: US-014-panels-required
genericTicketingProviderRegex: (US-[0-9]{3})
genericTicketingProviderUrlBuilder: https://sfdx-hardis-training.cloudity.com/BACKLOG/{REF}/
genericTicketingProviderDetailsUrlBuilder: https://sfdx-hardis-training.cloudity.com/BACKLOG/{REF}.json
manualActionsMode: sfdxHardis
failValidationOnPendingManualActions: true
testLevel: RunLocalTests
apexTestsMinCoverageOrgWide: 80
testCoverageNotBlocking: false
promotionConflictMarkersIgnoredFiles:
  - labs/*/level-2-contributor-advanced/2-7-resolve-a-git-merge-conflict.md
autoCleanTypes:
  - destructivechanges
  - localfields
  - productrequest
  - flowPositions
  - minimizeProfiles
autoRemoveUserPermissions:
  - EnableCommunityAppLauncher
  - FieldServiceAccess
  - OmnichannelInventorySync
  - SendExternalEmailAvailable
  - WorkCalibrationUser
dataPackages:
  - dataPath: scripts/data/HeliosBaseline
    importInScratchOrgs: false
  - dataPath: scripts/data/HeliosCrewRefData
    importInScratchOrgs: false
customCommandsPosition: first
customCommands:
  - id: training-level-1
    label: "Training: Level 1"
    description: Contributor basics - the commands the Level 1 labs ask for
    vscodeIcon: mortar-board
    sldsIcon: utility:education
    welcomeIconClass: cyan
    commands:
      - id: training-l1-init
        label: Set up my training environment
        vscodeIcon: repo-forked
        sldsIcon: utility:merge
        tooltip: Forks the repository, creates your scratch orgs with the Helios app, and wires the pipeline to them
        command: node scripts/training.mjs init
        helpUrl: https://sfdx-hardis-training.cloudity.com/en/level-1-contributor-basics/1-2-create-your-dev-hub-scratch-orgs-and-pipeline/
      - id: training-l1-status
        label: Where am I?
        vscodeIcon: compass
        sldsIcon: utility:location
        tooltip: Shows the level and lab you reached, and what to do next
        command: node scripts/training.mjs status
        helpUrl: https://sfdx-hardis-training.cloudity.com/
      - id: training-l1-check
        label: Check my work
        vscodeIcon: pass
        sldsIcon: utility:check
        tooltip: Verifies the Level 1 lab you just finished
        command: node scripts/training.mjs check --level 1
        helpUrl: https://sfdx-hardis-training.cloudity.com/badges/
      - id: training-l1-trigger
        label: Trigger my workflows
        vscodeIcon: play-circle
        sldsIcon: utility:play
        tooltip: Pushes one line so a fork whose Actions you have just enabled starts the checks of your Pull Request
        command: node scripts/training.mjs trigger
        helpUrl: https://sfdx-hardis-training.cloudity.com/en/level-1-contributor-basics/1-6-pull-request-deployment-check-and-merge/
      - id: training-l1-claim
        label: Claim my badge
        vscodeIcon: mortar-board
        sldsIcon: utility:favorite
        tooltip: Checks the whole of level 1, then opens the badge claim form with your answers already in it
        command: node scripts/training.mjs claim --level 1
        helpUrl: https://sfdx-hardis-training.cloudity.com/badges/
      - id: training-l1-update
        label: Update my course
        vscodeIcon: sync
        sldsIcon: utility:sync
        tooltip: Brings the changes the course received since you forked it, through a Pull Request into integration
        command: node scripts/training.mjs update
        helpUrl: https://sfdx-hardis-training.cloudity.com/en/help/#when-the-course-changed-after-you-forked
      - id: training-l1-reset
        label: Reset this level
        vscodeIcon: debug-restart
        sldsIcon: utility:refresh
        tooltip: Puts your repository back to the start of Level 1
        command: node scripts/training.mjs reset --level 1
        helpUrl: https://sfdx-hardis-training.cloudity.com/en/level-1-contributor-basics/
  - id: training-level-2
    label: "Training: Level 2"
    description: Contributor advanced - the commands the Level 2 labs ask for
    vscodeIcon: mortar-board
    sldsIcon: utility:education
    welcomeIconClass: indigo
    commands:
      - id: training-l2-init
        label: Set up my training environment
        vscodeIcon: repo-forked
        sldsIcon: utility:merge
        tooltip: Rebuilds a scratch org that expired, with the Helios app, and points the pipeline at it again
        command: node scripts/training.mjs init
        helpUrl: https://sfdx-hardis-training.cloudity.com/en/level-1-contributor-basics/1-2-create-your-dev-hub-scratch-orgs-and-pipeline/
      - id: training-l2-status
        label: Where am I?
        vscodeIcon: compass
        sldsIcon: utility:location
        tooltip: Shows the level and lab you reached, and what to do next
        command: node scripts/training.mjs status
        helpUrl: https://sfdx-hardis-training.cloudity.com/
      - id: training-l2-simulate
        label: Simulate my teammates
        vscodeIcon: organization
        sldsIcon: utility:groups
        tooltip: Creates the teammate branches and Pull Requests a Level 2 lab needs
        command: node scripts/training.mjs simulate --level 2
        helpUrl: https://sfdx-hardis-training.cloudity.com/en/level-2-contributor-advanced/2-7-resolve-a-git-merge-conflict/
      - id: training-l2-records
        label: Create my lab records
        vscodeIcon: database
        sldsIcon: utility:database
        tooltip: Creates the records a Level 2 lab starts from, in your dev org
        command: node scripts/training.mjs records
        helpUrl: https://sfdx-hardis-training.cloudity.com/en/level-2-contributor-advanced/2-4-ship-reference-data-and-a-batch-with-deployment-actions/
      - id: training-l2-seed
        label: Set up one of my training orgs
        vscodeIcon: cloud-upload
        sldsIcon: utility:upload
        tooltip: Deploys the Helios Energy app and its sample data into the org you choose
        command: node scripts/training.mjs seed
        helpUrl: https://sfdx-hardis-training.cloudity.com/en/level-2-contributor-advanced/
      - id: training-l2-check
        label: Check my work
        vscodeIcon: pass
        sldsIcon: utility:check
        tooltip: Verifies the Level 2 lab you just finished
        command: node scripts/training.mjs check --level 2
        helpUrl: https://sfdx-hardis-training.cloudity.com/badges/
      - id: training-l2-claim
        label: Claim my badge
        vscodeIcon: mortar-board
        sldsIcon: utility:favorite
        tooltip: Checks the whole of level 2, then opens the badge claim form with your answers already in it
        command: node scripts/training.mjs claim --level 2
        helpUrl: https://sfdx-hardis-training.cloudity.com/badges/
      - id: training-l2-update
        label: Update my course
        vscodeIcon: sync
        sldsIcon: utility:sync
        tooltip: Brings the changes the course received since you forked it, through a Pull Request into integration
        command: node scripts/training.mjs update
        helpUrl: https://sfdx-hardis-training.cloudity.com/en/help/#when-the-course-changed-after-you-forked
      - id: training-l2-reset
        label: Reset this level
        vscodeIcon: debug-restart
        sldsIcon: utility:refresh
        tooltip: Puts your repository back to the start of Level 2
        command: node scripts/training.mjs reset --level 2
        helpUrl: https://sfdx-hardis-training.cloudity.com/en/level-2-contributor-advanced/
  - id: training-level-3
    label: "Training: Level 3"
    description: Release Manager - the commands the Level 3 labs ask for
