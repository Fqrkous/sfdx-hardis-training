        tooltip: Puts the pipeline configuration you changed on a branch of its own and opens its Pull Request into integration
        command: node scripts/training.mjs publish
        helpUrl: https://sfdx-hardis-training.cloudity.com/en/level-3-release-manager/3-1-configure-the-pipeline-up-to-production/
      - id: training-l3-check
